name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Baseline: default CPU/GPU backend (host-detected), native build + full
  # CTest suite on every supported host toolchain.
  # ---------------------------------------------------------------------------
  cmake:
    name: CMake (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-2022
            compiler: msvc
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || (matrix.compiler == 'clang' && 'clang' || 'cl') }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || (matrix.compiler == 'clang' && 'clang++' || 'cl') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install clang (Linux)
        if: matrix.compiler == 'clang' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Configure
        shell: bash
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja --build-type=Release

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # CPU SIMD backend matrix: include/backend/cpu/{sse,avx,avx2,avx512,neon,sve}.
  # Each backend is always configured and built; the runtime CTest pass only
  # runs when the host actually exposes the required ISA, mirroring
  # LinearAlgebra's flag-based skip (grep /proc/cpuinfo), since GitHub-hosted
  # x86 runners do not guarantee AVX-512, and hosted arm64 runners do not
  # expose SVE.
  # ---------------------------------------------------------------------------
  simd:
    name: SIMD (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: no
          - os: ubuntu-latest
            backend: sse
          - os: ubuntu-latest
            backend: avx
          - os: ubuntu-latest
            backend: avx2
          - os: ubuntu-latest
            backend: avx512
          - os: macos-latest
            backend: neon
          - os: ubuntu-24.04-arm
            backend: sve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-simd --generator Ninja --build-type=Release
          --cpu-backend=${{ matrix.backend }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-simd --parallel 4

      - name: Test when the runner supports the ISA
        env:
          SIMD_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          case "$SIMD_BACKEND" in
            sse) required_flags="sse sse2" ;;
            avx) required_flags="avx" ;;
            avx2) required_flags="avx2 fma" ;;
            avx512) required_flags="avx512f avx2 fma" ;;
            neon)
              test "$(uname -m)" = arm64
              required_flags="" ;;
            sve) required_flags="__NEVER_PRESENT__" ;;
            *) required_flags="" ;;
          esac
          for flag in $required_flags; do
            if ! grep -qw "$flag" /proc/cpuinfo 2>/dev/null; then
              echo "Compile-only: runner lacks '$flag' for backend '$SIMD_BACKEND'" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-simd

  # ---------------------------------------------------------------------------
  # Intel SVML: ThirdParty/svml ships prebuilt Unix (.so) and Windows (.dll)
  # binaries directly in-tree, so no extra install step is required -- only
  # SCALARS_ENABLE_SVML=ON plus an x86 CPU backend that activates
  # backend/cpu/avx/svml.h (SCALARS_HAS_AVX || SCALARS_HAS_AVX2).
  # ---------------------------------------------------------------------------
  svml:
    name: SVML (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Configure
        shell: bash
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-svml --generator Ninja --build-type=Release
          --compile-commands=ON
          --svml=ON --cpu-backend=avx2

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-svml --parallel 4

      - name: Verify SVML was actually picked up
        # SCALARS_HAS_SVML is a plain configure-time variable, not a CACHE
        # entry, so it never lands in CMakeCache.txt -- check the compile
        # definition that scalars_apply_simd_compile_definitions() actually
        # applied to the library's translation units instead.
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          commands = json.loads(Path("build-svml/compile_commands.json").read_text())
          command = next(e["command"] for e in commands if e["file"].endswith("scalar_type.cpp"))
          # cl.exe/Ninja emits "/D...", GCC/Clang emit "-D...": match the
          # definition itself rather than assuming a GNU-style flag prefix.
          assert "SCALARS_HAS_SVML=1" in command, "SVML was not picked up by the build"
          PYCODE

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-svml

  sanitizer:
    name: Sanitizer (${{ matrix.os }}, ASan+UBSan)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-san --generator Ninja --build-type=Debug
          --sanitizer=ON
          --sanitizer-types=address,undefined

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-san --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-san

  valgrind:
    name: CTest Valgrind dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: python -m pip install cmake==4.1.2 ninja
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-memcheck --generator Ninja --valgrind=ON
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-memcheck --parallel 4
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-memcheck --memcheck

  # ---------------------------------------------------------------------------
  # GPU backends: hosted runners have no NVIDIA/AMD GPU, so these containers
  # validate that include/backend/gpu/* and the CUDA/HIP toolchain plumbing in
  # cmake/gpu_backend.cmake actually compile. TestGpuSimd.cu self-skips via
  # GTEST_SKIP() when gpu*GetDeviceCount() reports zero devices (see the file
  # header), so `ctest` is still run here -- it is a compile/link check for
  # the GPU tree plus a real pass/skip run of the whole CPU suite, not a GPU
  # correctness check. Real on-hardware validation is covered by the gated
  # self-hosted *-runtime jobs below.
  # ---------------------------------------------------------------------------
  cuda-compile:
    name: CUDA (Linux, compile + skip-aware test)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        # The container's apt cmake (3.22) is older than this project's
        # cmake_minimum_required (3.24).
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4

      - name: Configure
        # CMAKE_CUDA_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time -- unavailable in this GPU-less
        # container, so a fixed architecture is pinned here.
        # github.workspace resolves to the host path, not this container's
        # bind-mounted checkout, so the script is run via a relative path.
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-cuda --generator Ninja --build-type=Release
          --gpu-backend=cuda --lto-mode=off
          --cuda-architectures=75

      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-cuda --parallel 4

      - name: Test (GPU cases self-skip without a device)
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-cuda

  cuda-windows:
    name: CUDA (Windows compile-only)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install cmake==4.1.2 ninja
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: network
          # CUDA 13 moved crt/host_config.h into the crt component. nvcc also
          # needs nvvm and nvptxcompiler, which the nvcc package no longer pulls in.
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "nvptxcompiler"]'
      - name: Configure and compile GPU targets without executing GPU workloads
        shell: pwsh
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-cuda --generator Ninja --build-type=Release `
            --gpu-backend=cuda --lto-mode=off `
            --cuda-architectures=75
          if ($LASTEXITCODE -ne 0) { throw 'CUDA configure failed' }
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-cuda --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CUDA build failed' }

  hip-compile:
    name: HIP (Linux, compile + skip-aware test)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.3.1
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip rocthrust-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4

      - name: Configure
        # CMAKE_HIP_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time -- unavailable in this GPU-less
        # container, so a fixed architecture is pinned here.
        # github.workspace resolves to the host path, not this container's
        # bind-mounted checkout, so the script is run via a relative path.
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-hip --generator Ninja --build-type=Release
          --gpu-backend=hip --lto-mode=off
          --prefix-path=/opt/rocm --hip-architectures=gfx1100

      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-hip --parallel 4

      - name: Test (GPU cases self-skip without a device)
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-hip

  # ---------------------------------------------------------------------------
  # Metal: unlike the CUDA/HIP containers above, macOS hosted runners are
  # Apple Silicon with a real, usable Metal device, so this is an actual GPU
  # build + full CTest run, not just a compile check.
  # ---------------------------------------------------------------------------
  metal-build:
    name: Metal (macOS GPU build + test)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      OBJCXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.2 ninja
      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-metal --generator Ninja --build-type=Release
          --gpu-backend=metal --lto-mode=off
      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-metal --parallel 4
      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-metal

  # ---------------------------------------------------------------------------
  # Gated real-hardware runtime jobs. Enable only after registering a
  # self-hosted runner with the listed labels (see .github/actionlint.yaml)
  # and the matching GPU driver/toolkit. Run trusted main-branch code only.
  # ---------------------------------------------------------------------------
  cuda-runtime:
    name: CUDA (GPU runtime)
    if: github.event_name == 'push' && vars.SCALARS_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu22.04
      options: --gpus all
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip rocthrust-dev
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4

      - name: Verify GPU access
        run: nvidia-smi

      - name: Configure
        # github.workspace resolves to the host path, not this container's
        # bind-mounted checkout, so the script is run via a relative path.
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-gpu --generator Ninja --build-type=Release
          --gpu-backend=cuda --cuda-architectures=native

      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-gpu --parallel 4

      - name: Test
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-gpu

  hip-runtime:
    name: HIP (GPU runtime)
    if: github.event_name == 'push' && vars.SCALARS_ROCM_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30
    container:
      image: rocm/dev-ubuntu-22.04:6.3.1
      options: --device=/dev/kfd --device=/dev/dri --group-add video --group-add render --security-opt seccomp=unconfined
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4

      - name: Verify GPU access
        run: rocm-smi

      - name: Configure
        # github.workspace resolves to the host path, not this container's
        # bind-mounted checkout, so the script is run via a relative path.
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-gpu --generator Ninja --build-type=Release
          --gpu-backend=hip --hip-architectures=native
          --prefix-path=/opt/rocm

      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-gpu --parallel 4

      - name: Test
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-gpu

  install-consumer:
    name: Installed package (${{ matrix.os }}, shared=${{ matrix.shared }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        shared: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python -m pip install cmake==4.1.2 ninja

      - name: Build, install, then build/run the external consumer
        env:
          BUILD_SHARED: ${{ matrix.shared }}
        shell: bash
        run: |
          package_prefix="$RUNNER_TEMP/scalars-package"
          # Windows has no RPATH equivalent: the loader resolves Scalars.dll
          # via PATH instead, set further down before running the consumer.
          rpath_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            rpath_args=(--install-rpath='@loader_path/../lib')
          elif [[ "$RUNNER_OS" == Linux ]]; then
            # shellcheck disable=SC2016 # Keep the loader's literal origin token.
            rpath_args=(--install-rpath='$ORIGIN/../lib')
          fi
          # Force a fixed "lib" layout: GNUInstallDirs picks a Debian
          # multiarch lib dir (e.g. lib/x86_64-linux-gnu) by default on
          # Ubuntu runners, which would otherwise make the cmake/Scalars
          # config path below unpredictable across OSes.
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-install --generator Ninja --build-type=Release \
            --shared="$BUILD_SHARED" --testing=OFF \
            --install-libdir=lib --install-prefix="$package_prefix" \
            "${rpath_args[@]}"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-install --parallel 4
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build-install
          mv "$package_prefix" "$RUNNER_TEMP/scalars-package-moved"
          package_prefix="$RUNNER_TEMP/scalars-package-moved"
          # Copy the consumer outside the checkout; it must use installed headers/libraries.
          cp -R Testing/InstallConsumer "$RUNNER_TEMP/scalars-consumer"
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir "$RUNNER_TEMP/scalars-consumer" --build-dir "$RUNNER_TEMP/scalars-consumer-build" \
            --generator Ninja --build-type=Release --prefix-path="$package_prefix" \
            --package-dir="$package_prefix/lib/cmake/Scalars"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir "$RUNNER_TEMP/scalars-consumer-build" --parallel 4
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Scalars.dll lives in bin/, next to the import lib in lib/; put
            # it on PATH so the consumer executables can load it at test time.
            export PATH="$package_prefix/bin:$PATH"
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir "$RUNNER_TEMP/scalars-consumer-build"

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/
  # OpenCppCoverage (Windows), via the same coverage-tool + coverage.toml
  # already checked into the repo root.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: x64

      - name: Install CMake/Ninja + coverage-tool
        run: |
          python -m pip install cmake==4.1.2 ninja
          pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --compile-commands=ON
          --testing=ON
          --coverage=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --compile-commands=ON
          --testing=ON
          --coverage=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          name: coverage-${{ matrix.os }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Compiler cache / Icecream: exercises SCALARS_ENABLE_CACHE +
  # SCALARS_CACHE_BACKEND (ccache, sccache, buildcache) and SCALARS_ENABLE_ICECC
  # across every hosted OS. Icecream has no Windows port, so there is no
  # windows-icecc entry.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache/Icecc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
          - name: linux-icecc
            os: ubuntu-latest
            icecc: true
          - name: macos-ccache
            os: macos-15
            backend: ccache
          - name: macos-sccache
            os: macos-15
            backend: sccache
          - name: macos-icecc
            os: macos-15
            icecc: true
          - name: windows-ccache
            os: windows-2022
            backend: ccache
          - name: windows-sccache
            os: windows-2022
            backend: sccache
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
          - name: macos-buildcache
            os: macos-15
            backend: buildcache
          - name: windows-buildcache
            os: windows-2022
            backend: buildcache
    env:
      CACHE_BACKEND: ${{ matrix.backend }}
      USE_ICECC: ${{ matrix.icecc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Install ccache (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'ccache'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Install icecc (Linux)
        if: runner.os == 'Linux' && matrix.icecc == true
        run: sudo apt-get update && sudo apt-get install -y icecc

      - name: Install ccache (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'ccache'
        run: brew install ccache

      - name: Install icecream (macOS)
        if: runner.os == 'macOS' && matrix.icecc == true
        run: brew install icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'ccache'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.backend == 'sccache'
        with:
          version: v0.12.0

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure
        shell: bash
        run: |
          args=(--build-type=Release)
          if [ -n "$CACHE_BACKEND" ]; then
            args+=(--cache=ON --cache-backend="$CACHE_BACKEND")
          fi
          if [ "$USE_ICECC" = "true" ]; then
            args+=(--icecc=ON)
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja "${args[@]}"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build
